name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          python build.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniInstaller-Windows
          path: dist/OmniInstaller.exe

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linux system dependencies (Qt6)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          python build.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniInstaller-Linux
          path: dist/OmniInstaller-Linux

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: OmniInstaller-Windows
          path: dist-release/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: OmniInstaller-Linux
          path: dist-release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/OmniInstaller.exe
            dist-release/OmniInstaller-Linux
          draft: false
          prerelease: false
          generate_release_notes: true
